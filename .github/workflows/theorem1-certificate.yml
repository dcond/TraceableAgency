name: Theorem 1 certificate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: false
      - name: Check the paper-faithful kernel certificate
        run: ./scripts/check_theorem1_certificate.sh
